name: Publish demo

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build verified main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pages: read
    steps:
      - name: Require a successful main regression check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          runs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/regression.yml/runs" \
            -f branch=main -f event=push -f status=success -f head_sha="$GITHUB_SHA" \
            --jq '.total_count')"
          if [[ "$runs" -eq 0 ]]; then
            echo "The Regression suite push run must pass for $GITHUB_SHA before publishing." >&2
            exit 1
          fi
      - name: Check out verified revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Set up Python
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.8"
          python-version: "3.13"
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the fixture-only demo
        run: |
          uv sync --locked
          uv run --locked python -m evalsuite demo
          npm ci --prefix web
          npm run build --prefix web
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist
  deploy:
    name: Deploy demo
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
