name: Regression suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      scenario:
        description: Frozen evidence scenario
        type: choice
        options: [repaired, regressed]
        default: repaired
        required: true

permissions:
  contents: read

jobs:
  regression:
    name: Regression check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: evalsuite
          POSTGRES_PASSWORD: evalsuite_ci
          POSTGRES_DB: evalsuite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U evalsuite -d evalsuite_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Check out trusted base revision
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          path: .trusted-reference
          persist-credentials: false
      - name: Set up Python
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.8"
          python-version: "3.13"
      - name: Install Python dependencies
        id: python-dependencies
        run: uv sync --locked
      - name: Evaluate frozen evidence
        env:
          SCENARIO: ${{ inputs.scenario || 'repaired' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" || "$GITHUB_EVENT_NAME" == "merge_group" ]]; then
            if [[ -z "$BASE_SHA" || "$(git -C .trusted-reference rev-parse HEAD)" != "$BASE_SHA" ]]; then
              echo "The trusted base checkout does not match the event base SHA." >&2
              exit 1
            fi
            args+=(--reference .trusted-reference)
          fi
          uv run --locked python -m evalsuite compare --mode fixture --scenario "$SCENARIO" \
            --out artifacts/ci "${args[@]}"
      - name: Replay the saved comparison
        if: ${{ !cancelled() && steps.python-dependencies.outcome == 'success' }}
        run: |
          uv run --locked python - <<'PY'
          from pathlib import Path
          from evalsuite.reporting import markdown
          from evalsuite.runner import read_artifact

          directory = Path("artifacts/ci")
          comparison = read_artifact(directory / "comparison.json")
          if (directory / "report.md").read_text(encoding="utf-8") != markdown(comparison):
              raise ValueError("The Markdown report differs from its verified comparison.")
          print(f"Verified {comparison.id} with verdict {comparison.summary.verdict}.")
          PY
      - name: Show regression report
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/ci/report.md ]]; then
            cat artifacts/ci/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'The fixture comparison did not produce a report. See the evaluation log.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regression-evidence
          path: |
            artifacts/ci/comparison.json
            artifacts/ci/report.md
          if-no-files-found: error
      - name: Lint Python
        if: ${{ !cancelled() && steps.python-dependencies.outcome == 'success' }}
        run: uv run --locked python -m ruff check src tests
      - name: Test Python and PostgreSQL
        if: ${{ !cancelled() && steps.python-dependencies.outcome == 'success' }}
        env:
          TEST_DATABASE_URL: postgresql://evalsuite:evalsuite_ci@127.0.0.1:5432/evalsuite_test
        run: uv run --locked python -m pytest
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the demo console
        run: |
          uv run --locked python -m evalsuite demo
          npm ci --prefix web
          npm run build --prefix web
      - name: Test console navigation across browser engines
        working-directory: web
        run: |
          npm exec -- playwright install --with-deps --only-shell chromium firefox webkit
          npm run test:navigation
