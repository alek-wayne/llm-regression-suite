[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "llm-regression-suite"
version = "1.0.1"
description = "Paired evaluation and release gates for a policy-grounded support assistant"
requires-python = ">=3.12,<3.15"
dependencies = [
    "anthropic>=2.12,<3",
    "fastapi>=0.128,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.12,<3",
    "uvicorn>=0.38,<1",
]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.16,<1", "hypothesis>=6.140,<7", "httpx>=0.28,<1"]

[project.scripts]
evalsuite = "evalsuite.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/evalsuite"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
